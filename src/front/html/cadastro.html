<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CanilManager - Criar Conta</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marromescuro: '#1C1105',
            laranja: '#D97706',
            creme: '#F8F5F0',
            bege: '#EFECE6',
            verdeok: '#10B981',
            vermelho: '#EF4444',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Remix Icon -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="font-sans bg-creme text-marromescuro flex flex-col items-center justify-center min-h-screen p-6">

  <!-- CONTAINER CENTRAL -->
  <div class="w-full max-w-[420px] flex flex-col items-center">

    <!-- LOGO E SUBTÍTULO -->
    <div class="text-center mb-8">
      <div class="font-serif text-3xl font-extrabold text-[#111827] tracking-tight mb-1">
        Canil<span class="text-laranja">Manager</span>
      </div>
      <p class="text-xs text-[#6B7280]">Crie sua conta e comece a gerenciar seu canil</p>
    </div>

    <!-- CAIXA DO FORMULÁRIO -->
    <div class="w-full bg-white border border-[#EFECE6] rounded-[28px] p-8 shadow-sm">
      <form id="form-cadastro" class="space-y-4" novalidate>

        <div>
          <label class="block text-xs font-bold text-[#111827] mb-1.5">Nome completo</label>
          <input type="text" id="cad-nome" placeholder="Seu nome" required
            class="w-full bg-[#FAF8F5] border border-[#EFECE6] rounded-2xl py-3 px-4 text-xs text-[#111827] font-medium focus:outline-none focus:border-laranja focus:ring-1 focus:ring-laranja transition-all placeholder:text-gray-400">
        </div>

        <div>
          <label class="block text-xs font-bold text-[#111827] mb-1.5">Email</label>
          <input type="email" id="cad-email" placeholder="seu@email.com" required
            class="w-full bg-[#FAF8F5] border border-[#EFECE6] rounded-2xl py-3 px-4 text-xs text-[#111827] font-medium focus:outline-none focus:border-laranja focus:ring-1 focus:ring-laranja transition-all placeholder:text-gray-400">
        </div>

        <div>
          <label class="block text-xs font-bold text-[#111827] mb-1.5">Senha</label>
          <div class="relative">
            <input type="password" id="cad-senha" placeholder="Mínimo 6 caracteres" minlength="6" required
              class="w-full bg-[#FAF8F5] border border-[#EFECE6] rounded-2xl py-3 pl-4 pr-10 text-xs text-[#111827] font-medium focus:outline-none focus:border-laranja focus:ring-1 focus:ring-laranja transition-all placeholder:text-gray-400">
            <button type="button" id="btn-toggle-senha"
              class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 transition-colors">
              <i id="icone-olho-1" class="ri-eye-line text-base"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-[#111827] mb-1.5">Confirmar senha</label>
          <div class="relative">
            <input type="password" id="cad-confirma" placeholder="Repita a senha" minlength="6" required
              class="w-full bg-[#FAF8F5] border border-[#EFECE6] rounded-2xl py-3 pl-4 pr-10 text-xs text-[#111827] font-medium focus:outline-none focus:border-laranja focus:ring-1 focus:ring-laranja transition-all placeholder:text-gray-400">
            <button type="button" id="btn-toggle-confirma"
              class="absolute right-3.5 top-3 text-gray-400 hover:text-gray-600 transition-colors">
              <i id="icone-olho-2" class="ri-eye-line text-base"></i>
            </button>
          </div>
        </div>

        <button type="submit"
          class="w-full bg-laranja hover:bg-opacity-95 text-white font-bold text-xs py-3.5 rounded-2xl transition-all shadow-sm mt-2">
          Criar conta
        </button>

        <div class="text-center pt-2">
          <p class="text-xs text-[#6B7280]">
            Já tem uma conta? <a href="login.html" class="text-laranja font-bold hover:underline">Faça login</a>
          </p>
        </div>

      </form>
    </div>

  </div>

  <!-- TOAST DE NOTIFICAÇÃO -->
  <div id="toast-cadastro"
    class="fixed top-6 right-8 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px]">
    <span id="toast-msg" class="text-xs font-semibold"></span>
  </div>

  <!-- SCRIPT DE COMPORTAMENTO -->
  <script>
    console.log('O script de cadastro foi carregado com sucesso!');
    document.addEventListener('DOMContentLoaded', () => {
      const formCadastro = document.getElementById('form-cadastro');
      const inputSenha = document.getElementById('cad-senha');
      const inputConfirma = document.getElementById('cad-confirma');
      const btnToggleSenha = document.getElementById('btn-toggle-senha');
      const iconeOlho1 = document.getElementById('icone-olho-1');
      const btnToggleConfirma = document.getElementById('btn-toggle-confirma');
      const iconeOlho2 = document.getElementById('icone-olho-2');
      const toast = document.getElementById('toast-cadastro');

      btnToggleSenha.onclick = () => {
        if (inputSenha.type === 'password') {
          inputSenha.type = 'text';
          iconeOlho1.className = 'ri-eye-off-line text-base';
        } else {
          inputSenha.type = 'password';
          iconeOlho1.className = 'ri-eye-line text-base';
        }
      };

      btnToggleConfirma.onclick = () => {
        if (inputConfirma.type === 'password') {
          inputConfirma.type = 'text';
          iconeOlho2.className = 'ri-eye-off-line text-base';
        } else {
          inputConfirma.type = 'password';
          iconeOlho2.className = 'ri-eye-line text-base';
        }
      };

      function mostrarToast(msg, tipo = 'sucesso') {
        toast.querySelector('span').textContent = msg;
        if (tipo === 'sucesso') {
          toast.className = "fixed top-6 right-8 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg transition-all duration-300 bg-[#ECFDF5] border border-[#A7F3D0] text-[#065F46] opacity-100 translate-y-0";
        } else {
          toast.className = "fixed top-6 right-8 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg transition-all duration-300 bg-[#FEE2E2] border border-[#FCA5A5] text-[#991B1B] opacity-100 translate-y-0";
        }
        setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
        }, 3000);
      }

      formCadastro.onsubmit = async (e) => {
        e.preventDefault();
        console.log('O botão de criar conta foi clicado!');
        const nome = document.getElementById('cad-nome').value.trim();
        const email = document.getElementById('cad-email').value.trim();
        const senha = inputSenha.value;
        const confirma = inputConfirma.value;

        if (senha !== confirma) {
          console.log('🛑 Erro: As senhas digitadas não coincidem.');
          mostrarToast("As senhas não coincidem!", "erro");
          return;
        }

        try {
          const resposta = await fetch('http://localhost:3000/api/usuarios/cadastro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nome, email, senha }),
          });

          const dados = await resposta.json();
          console.log('📡 Status da API:', resposta.status);
          console.log('📦 Resposta da API:', dados);

          if (resposta.ok) {
            mostrarToast("Conta criada com sucesso! Redirecionando para o login...", "sucesso");
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 1200);
          } else {
            mostrarToast(dados.mensagem || "Erro ao criar conta.", "erro");
          }
        } catch (erro) {
          console.error('🔥 Erro no fetch:', erro);
          mostrarToast("Não foi possível conectar ao servidor. Tente novamente.", "erro");
        }
      };
    });
  </script>
</body>

</html>
